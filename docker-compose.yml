services:
  nginx:
    image: nginx:alpine
    container_name: scraper-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - scraper-net

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: scraper-php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      - CI_ENVIRONMENT=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLX_AUTHORIZED_API_BASE_URL=http://python-extractor:8000
    depends_on:
      - redis
      - python-extractor
    networks:
      - scraper-net

  python-extractor:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: scraper-python-extractor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - scraper-net

  redis:
    image: redis:alpine
    container_name: scraper-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - scraper-net

networks:
  scraper-net:
    driver: bridge
